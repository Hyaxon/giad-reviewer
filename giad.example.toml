# Copy to an explicitly selected trusted config file; no automatic lookup exists.
# Replace the example model tag with a downloaded model you want to evaluate.
[models.review]
provider = "ollama"
endpoint = "http://127.0.0.1:11434"
model = "qwen3.6:27b"

# Agent names match manifests. This runtime does not contain the reviewer package.
[agents.reviewer]
sandbox_image = "your-installed-reviewer:local"
capabilities = [
  "repository.read",
  "repository.search",
  "git.diff",
  "repository.instructions",
  "github.linked_issues",
  "model.chat",
]

# To enable tests, also declare/grant "tests.run" and add
# test_profiles = ["go"] under [agents.reviewer]. Run make images first.
[tests.go]
image = "giad-go-tests:example"
command = "/usr/local/go/bin/go"
args = ["test", "-p", "1", "./..."]
timeout_seconds = 120

# workspace.write, web.search and browser are currently unavailable.
