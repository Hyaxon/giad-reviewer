name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js for Markdown tooling
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.3

  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on these files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Check module files
        run: go mod tidy -diff

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build CLI and example agent
        run: make all

      - name: Smoke-test CLI
        run: |
          ./bin/giad --help
          ./bin/giad --version

      - name: Build isolated example images
        run: make images

      - name: Verify real agent isolation and cleanup
        run: make sandbox-smoke
