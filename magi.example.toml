# Copy to magi.toml when implementing configuration loading.

[agents.melchior]
enabled = true
model = "qwen3.6:27b"

[agents.balthasar]
enabled = true
model = "devstral-small-2"

[agents.casper]
enabled = true
model = "qwen3-coder:30b"

[runtime]
sequential = true
unload_model_after_agent = true
context_tokens = 32768

[publishing]
event = "COMMENT"
preview_before_publish = true
minimum_confidence = 0.85

[requirements]
enabled = true
source = "github_linked_issues"
missing_link = "warn"
read_issue_comments = false
allow_inferred_blocking_findings = false
